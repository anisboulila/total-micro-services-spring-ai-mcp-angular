# Development-only defaults; override with SPRING_DATASOURCE_* outside local use.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:customer_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:customer-local-only}
# Le service Customer utilise son schéma applicatif et l'historique Flyway déjà validés par les tests PostgreSQL.
spring.flyway.schemas=cps_customer_schema
spring.flyway.default-schema=cps_customer_schema
spring.jpa.properties.hibernate.default_schema=cps_customer_schema
customer.security.jwt.issuer-uri=${CUSTOMER_SECURITY_ISSUER_URI:http://localhost:8081/realms/customer-dev}
customer.security.jwt.jwk-set-uri=${CUSTOMER_SECURITY_JWK_SET_URI:http://localhost:8081/realms/customer-dev/protocol/openid-connect/certs}
customer.security.jwt.audience=${CUSTOMER_SECURITY_AUDIENCE:customer-service}
