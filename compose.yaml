services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_db}
      POSTGRES_USER: ${POSTGRES_USER:-customer_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-customer_db}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-customer_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-customer-local-only}
      CUSTOMER_SECURITY_ISSUER_URI: "http://localhost:8081/realms/customer-dev"
      CUSTOMER_SECURITY_JWK_SET_URI: "http://keycloak:8080/realms/customer-dev/protocol/openid-connect/certs"
      CUSTOMER_SECURITY_AUDIENCE: "customer-service"
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  customer-postgres-data:
  keycloak-data:
