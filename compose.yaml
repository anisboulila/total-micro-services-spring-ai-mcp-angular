services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_db}
      POSTGRES_USER: ${POSTGRES_USER:-customer_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  customer-postgres-data:
