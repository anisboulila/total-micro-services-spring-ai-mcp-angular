server.port=8080

# Le port de gestion reste distinct du port HTTP publié par la Gateway.
management.server.port=8085
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health

gateway.security.jwt.issuer-uri=${GATEWAY_SECURITY_ISSUER_URI:http://localhost:8081/realms/customer-dev}
gateway.security.jwt.jwk-set-uri=${GATEWAY_SECURITY_JWK_SET_URI:http://localhost:8081/realms/customer-dev/protocol/openid-connect/certs}
gateway.security.jwt.audience=${GATEWAY_SECURITY_AUDIENCE:customer-service}
gateway.routes.customer-service-uri=${GATEWAY_CUSTOMER_SERVICE_URI:http://localhost:8082}
